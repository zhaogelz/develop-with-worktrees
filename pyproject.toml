[project]
name = "develop-with-worktrees"
version = "0.5.0-beta.2"
requires-python = ">=3.11"
dependencies = ["psutil>=7.0,<8"]

[dependency-groups]
dev = ["pytest>=8.3,<10"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
markers = [
  "dww_fast: 纯本地、快速的 DWW 回归；可作为 Ready 的候选。",
  "dww_full: 需要完整 Git、进程、并发或恢复语义的 DWW 回归。",
  "dww_stress: 超出默认工作负载的压力或长时间回归，仅由明确入口执行。",
]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"plugins/develop-with-worktrees/hooks/worktree_guard.py" = ["E402"]
"tests/conftest.py" = ["E402"]

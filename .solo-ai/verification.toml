schema_version = 3
static_only = false

# 覆盖所有跟踪路径的真实静态检查。它既阻止未知路径静默通过，也为
# 输入闭包不变的纯检查提供可复用的证明。
[[profiles]]
id = "repository-static-ready"
paths = ["**"]
cross_task_reuse = true
external_state = "none"
input_paths = ["**"]
environment = ["PROCESSOR_ARCHITECTURE", "PROCESSOR_ARCHITEW6432"]
input_closure = "complete"
timeout_seconds = 120
resource_class = "normal"
level = "ready"
commands = [
  ["uv", "run", "python", "scripts/verify_repository.py"],
]

# Ruff 已锁定在 uv.lock；开发期先做格式与语法检查，完整输入闭包未变时可
# 复用同仓库证明。Ready/Full 不隐式重复它，开发者需要时显式运行 development。
[[profiles]]
id = "dww-lint-development"
paths = [
  ".github/**", ".solo-ai/**", "AGENTS.md", "pyproject.toml",
  "scripts/verify_repository.py", "tests/**", "uv.lock",
  "plugins/develop-with-worktrees/hooks/**",
  "plugins/develop-with-worktrees/skills/develop-with-worktrees/agents/**",
  "plugins/develop-with-worktrees/skills/develop-with-worktrees/scripts/**",
]
cross_task_reuse = true
external_state = "none"
input_paths = ["**"]
environment = ["PROCESSOR_ARCHITECTURE", "PROCESSOR_ARCHITEW6432"]
input_closure = "complete"
timeout_seconds = 120
resource_class = "normal"
level = "development"
commands = [
  ["uv", "run", "ruff", "check", "."],
  ["uv", "run", "ruff", "format", "--check", "."],
]

# 核心代码、策略、测试及 CI 再运行可快速、纯本地的回归；测试层级由
# tests/conftest.py 集中审计，新增测试默认进入 dww_full。
[[profiles]]
id = "dww-fast-ready"
paths = [
  ".github/**", ".solo-ai/**", "AGENTS.md", "pyproject.toml",
  "scripts/verify_repository.py", "tests/**", "uv.lock",
  "plugins/develop-with-worktrees/hooks/**",
  "plugins/develop-with-worktrees/skills/develop-with-worktrees/agents/**",
  "plugins/develop-with-worktrees/skills/develop-with-worktrees/scripts/**",
]
cross_task_reuse = true
external_state = "none"
input_paths = [
  "AGENTS.md", ".solo-ai/verification.toml", ".solo-ai/stress-verification.toml",
  "pyproject.toml", "tests/conftest.py", "tests/unit/test_config.py",
  "tests/unit/test_proof.py", "tests/unit/test_routing.py",
  "tests/unit/test_safety.py", "tests/unit/test_task_context.py",
  "tests/unit/test_host_context.py", "tests/unit/test_host_handoff_state.py",
  "tests/unit/test_root_context.py", "tests/unit/test_hook.py",
  "tests/unit/test_test_temporary_directory.py", "tests/unit/test_test_layers.py", "uv.lock",
  "plugins/develop-with-worktrees/skills/develop-with-worktrees/scripts/**",
]
environment = ["PROCESSOR_ARCHITECTURE", "PROCESSOR_ARCHITEW6432"]
input_closure = "complete"
timeout_seconds = 600
resource_class = "normal"
level = "ready"
commands = [
  ["uv", "run", "pytest", "-m", "dww_fast", "-q", "--durations=20"],
]

# 日常组合验证只覆盖最小真实生命周期：它仍包含按变更选中的 Ready，且验证
# 配置、CLI 或批次实现的改动会再经过候选发布与精确封批。它不是宽回归入口。
[[profiles]]
id = "dww-batch-integration"
paths = [
  ".github/**", ".solo-ai/**", "AGENTS.md", "pyproject.toml",
  "scripts/verify_repository.py", "tests/**", "uv.lock",
  "plugins/develop-with-worktrees/hooks/**",
  "plugins/develop-with-worktrees/skills/develop-with-worktrees/agents/**",
  "plugins/develop-with-worktrees/skills/develop-with-worktrees/scripts/**",
]
cross_task_reuse = false
external_state = "unknown"
input_paths = [
  "pyproject.toml", "tests/conftest.py", "tests/integration/test_cli.py",
  "tests/integration/test_lifecycle.py",
  "tests/integration/test_candidate_batches.py",
  "tests/integration/test_host_handoffs.py", "tests/unit/test_config.py",
  "tests/unit/test_proof.py", "tests/unit/test_root_context.py",
  "tests/unit/test_hook.py", "tests/unit/test_test_temporary_directory.py", "uv.lock",
  "plugins/develop-with-worktrees/skills/develop-with-worktrees/scripts/**",
]
environment = ["PROCESSOR_ARCHITECTURE", "PROCESSOR_ARCHITEW6432"]
input_closure = "declared"
timeout_seconds = 900
resource_class = "heavy"
level = "full"
full_scope = "integration"
commands = [
  ["uv", "run", "pytest", "-q", "tests/unit/test_root_context.py", "tests/unit/test_hook.py", "tests/unit/test_test_temporary_directory.py", "tests/unit/test_config.py", "tests/integration/test_cli.py::test_cli_plan_and_verify_cover_registered_development_ready_full_and_stress_levels", "tests/integration/test_cli.py::test_cli_init_accepts_a_reviewed_verification_file", "tests/integration/test_cli.py::test_cli_choose_isolated_accepts_a_reviewed_verification_file", "tests/integration/test_lifecycle.py::test_initialize_discovery_creates_a_conservative_integration_full_profile", "tests/integration/test_lifecycle.py::test_deinit_accepts_the_exact_known_legacy_managed_block", "tests/integration/test_lifecycle.py::test_deinit_preserves_a_user_edited_managed_block", "tests/integration/test_lifecycle.py::test_configured_dev_and_warm_commands_require_current_approval", "tests/integration/test_candidate_batches.py::test_finish_publishes_then_explicit_seal_integrates_exact_candidates", "tests/integration/test_candidate_batches.py::test_batch_validation_uses_integration_scope", "tests/integration/test_host_handoffs.py", "--durations=10"],
]

# 宽回归是明确里程碑入口（dww verify --level full --complete 或 CI），不会
# 因日常候选或尾批自动重复执行。压力层仍有独立显式入口。
[[profiles]]
id = "dww-core-complete"
paths = [
  ".github/**", ".solo-ai/**", "AGENTS.md", "pyproject.toml",
  "scripts/verify_repository.py", "tests/**", "uv.lock",
  "plugins/develop-with-worktrees/hooks/**",
  "plugins/develop-with-worktrees/skills/develop-with-worktrees/agents/**",
  "plugins/develop-with-worktrees/skills/develop-with-worktrees/scripts/**",
]
cross_task_reuse = false
external_state = "unknown"
input_paths = [
  ".github/**", ".solo-ai/**", "AGENTS.md", "pyproject.toml",
  "scripts/verify_repository.py", "tests/**", "uv.lock",
  "plugins/develop-with-worktrees/hooks/**",
  "plugins/develop-with-worktrees/skills/develop-with-worktrees/agents/**",
  "plugins/develop-with-worktrees/skills/develop-with-worktrees/scripts/**",
]
environment = ["PROCESSOR_ARCHITECTURE", "PROCESSOR_ARCHITEW6432"]
input_closure = "declared"
timeout_seconds = 43200
resource_class = "heavy"
level = "full"
full_scope = "complete"
commands = [
  ["uv", "run", "pytest", "-m", "dww_full and not dww_stress", "-vv", "-x", "--durations=30"],
]

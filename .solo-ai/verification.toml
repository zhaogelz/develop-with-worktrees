schema_version = 3
static_only = false

# 覆盖所有跟踪路径的真实静态检查。它既阻止未知路径静默通过，也为
# 输入闭包不变的纯检查提供可复用的证明。
[[profiles]]
id = "repository-static-ready"
paths = ["**"]
cross_task_reuse = true
external_state = "none"
input_paths = ["**"]
environment = ["PROCESSOR_ARCHITECTURE", "PROCESSOR_ARCHITEW6432"]
input_closure = "complete"
timeout_seconds = 120
resource_class = "normal"
level = "ready"
commands = [
  ["uv", "run", "python", "scripts/verify_repository.py"],
]

# Ruff 已锁定在 uv.lock；开发期先做格式与语法检查，完整输入闭包未变时可
# 复用同仓库证明。Ready/Full 不隐式重复它，开发者需要时显式运行 development。
# 若格式检查失败，先对审查过的改动路径运行 `uv run ruff format --diff
# <path ...>` 获取补丁，再修复并重跑本检查；不要因此提前启动组合批次。
[[profiles]]
id = "dww-lint-development"
paths = [
  ".github/**", ".solo-ai/**", "AGENTS.md", "pyproject.toml",
  "scripts/verify_repository.py", "tests/**", "uv.lock",
  "plugins/develop-with-worktrees/hooks/**",
  "plugins/develop-with-worktrees/skills/develop-with-worktrees/agents/**",
  "plugins/develop-with-worktrees/skills/develop-with-worktrees/scripts/**",
]
cross_task_reuse = true
external_state = "none"
input_paths = ["**"]
environment = ["PROCESSOR_ARCHITECTURE", "PROCESSOR_ARCHITEW6432"]
input_closure = "complete"
timeout_seconds = 120
resource_class = "normal"
level = "development"
commands = [
  ["uv", "run", "ruff", "check", "."],
  ["uv", "run", "ruff", "format", "--check", "."],
]

# 核心代码、策略、测试及 CI 再运行可快速、纯本地的回归；测试层级由
# tests/conftest.py 集中审计，新增测试默认进入 dww_full。pytest 的 -m
# 过滤发生在收集之后，因此整个 tests/ 树都是这条命令的实际输入。
[[profiles]]
id = "dww-fast-ready"
paths = [
  ".github/**", ".solo-ai/**", "AGENTS.md", "pyproject.toml",
  "scripts/verify_repository.py", "tests/**", "uv.lock",
  "plugins/develop-with-worktrees/hooks/**",
  "plugins/develop-with-worktrees/skills/develop-with-worktrees/agents/**",
  "plugins/develop-with-worktrees/skills/develop-with-worktrees/scripts/**",
]
cross_task_reuse = true
external_state = "none"
input_paths = [
  "AGENTS.md", ".solo-ai/verification.toml", ".solo-ai/stress-verification.toml",
  "pyproject.toml", "tests/**",
  "plugins/develop-with-worktrees/maintain-dww-plugin.ps1", "uv.lock",
  "plugins/develop-with-worktrees/hooks/**",
  "plugins/develop-with-worktrees/skills/develop-with-worktrees/scripts/**",
]
environment = ["PROCESSOR_ARCHITECTURE", "PROCESSOR_ARCHITEW6432"]
input_closure = "complete"
timeout_seconds = 600
resource_class = "normal"
level = "ready"
commands = [
  ["uv", "run", "pytest", "-m", "dww_fast", "-q", "--durations=20"],
]

# 日常组合验证只覆盖最小真实生命周期：它仍包含按变更选中的 Ready，且验证
# 配置、CLI 或批次实现的改动会再经过候选发布与精确封批。查询投影、根版本
# 门禁、Finish 意图、尾批准入和运行时 release 各保留一个真实行为用例；这是
# 职责到测试的最小映射，不是宽回归入口。
[[profiles]]
id = "dww-batch-integration"
paths = [
  ".github/**", ".solo-ai/**", "AGENTS.md", "pyproject.toml",
  "scripts/verify_repository.py", "tests/**", "uv.lock",
  "plugins/develop-with-worktrees/hooks/**",
  "plugins/develop-with-worktrees/skills/develop-with-worktrees/agents/**",
  "plugins/develop-with-worktrees/skills/develop-with-worktrees/scripts/**",
]
cross_task_reuse = false
external_state = "unknown"
input_paths = [
  "pyproject.toml", "tests/conftest.py", "tests/integration/test_cli.py",
  "tests/integration/test_lifecycle.py", "tests/integration/test_plugin_maintenance_script.py",
  "tests/integration/test_candidate_batches.py",
  "tests/integration/test_host_handoffs.py",
  "tests/unit/test_proof.py", "tests/unit/test_root_context.py",
  "tests/unit/test_hook.py", "tests/unit/test_test_temporary_directory.py", "uv.lock",
  "plugins/develop-with-worktrees/hooks/**",
  "plugins/develop-with-worktrees/skills/develop-with-worktrees/scripts/**",
  "plugins/develop-with-worktrees/maintain-dww-plugin.ps1",
]
environment = ["PROCESSOR_ARCHITECTURE", "PROCESSOR_ARCHITEW6432"]
input_closure = "declared"
timeout_seconds = 900
resource_class = "heavy"
level = "full"
full_scope = "integration"
commands = [
  ["uv", "run", "pytest", "-q", "tests/unit/test_root_context.py", "tests/unit/test_hook.py", "tests/unit/test_test_temporary_directory.py", "tests/integration/test_cli.py::test_cli_plan_and_verify_cover_registered_development_ready_full_and_stress_levels", "tests/integration/test_cli.py::test_cli_init_accepts_a_reviewed_verification_file", "tests/integration/test_cli.py::test_cli_choose_isolated_accepts_a_reviewed_verification_file", "tests/integration/test_lifecycle.py::test_initialize_empty_repo_uses_custom_unborn_branch_and_empty_baseline", "tests/integration/test_lifecycle.py::test_initialize_empty_repo_preserves_user_content_without_baseline", "tests/integration/test_lifecycle.py::test_initialize_empty_repo_missing_author_can_retry_without_duplicate_baseline", "tests/integration/test_lifecycle.py::test_initialize_preserves_unreadable_refs_and_existing_history", "tests/integration/test_lifecycle.py::test_initialize_uses_current_branch_instead_of_legacy_default", "tests/integration/test_lifecycle.py::test_initialize_accepts_a_custom_current_branch_despite_legacy_default", "tests/integration/test_lifecycle.py::test_linked_worktree_owns_initialization_and_batched_delivery", "tests/integration/test_lifecycle.py::test_dirty_linked_worktree_bootstrap_records_and_rechecks_its_target", "tests/integration/test_lifecycle.py::test_legacy_dirty_bootstrap_uses_only_a_verifiable_target", "tests/integration/test_lifecycle.py::test_initialize_discovery_creates_a_conservative_integration_full_profile", "tests/integration/test_lifecycle.py::test_deinit_accepts_the_exact_known_legacy_managed_block", "tests/integration/test_lifecycle.py::test_deinit_preserves_a_user_edited_managed_block", "tests/integration/test_lifecycle.py::test_configured_dev_and_warm_commands_require_current_approval", "tests/integration/test_lifecycle.py::test_structured_root_review_recovers_automatically_before_commit_and_ready", "tests/integration/test_lifecycle.py::test_ready_does_not_blindly_rerun_an_unchanged_deterministic_failure", "tests/integration/test_lifecycle.py::test_finish_keeps_ready_proof_when_prepublication_cleanup_blocks", "tests/integration/test_candidate_batches.py::test_finish_publishes_then_explicit_seal_integrates_exact_candidates", "tests/integration/test_candidate_batches.py::test_finish_delivery_intent_seals_only_its_exact_candidate_lane", "tests/integration/test_candidate_batches.py::test_finish_delivery_intent_waiting_for_another_batch_does_not_claim_its_identity", "tests/integration/test_candidate_batches.py::test_finish_delivery_intent_is_validated_persisted_and_recovered_once", "tests/integration/test_candidate_batches.py::test_round_complete_tail_waits_for_active_producers_and_records_its_basis", "tests/integration/test_candidate_batches.py::test_composed_commits_keep_source_summary_and_traceability", "tests/integration/test_candidate_batches.py::test_compact_exact_task_query_ignores_unrelated_terminal_history", "tests/integration/test_candidate_batches.py::test_live_operation_error_has_a_safe_structured_wait_action", "tests/integration/test_candidate_batches.py::test_workspace_ownership_drift_has_a_safe_structured_preserve_action", "tests/integration/test_candidate_batches.py::test_batch_runtime_release_failure_blocks_promotion_and_recovery_reuses_full", "tests/integration/test_candidate_batches.py::test_batch_validation_uses_integration_scope", "tests/integration/test_host_handoffs.py", "tests/integration/test_cli.py::test_root_accept_parser_requires_one_evidence_input_and_forwards_inline_json", "tests/integration/test_lifecycle.py::test_root_accept_cli_requires_valid_inline_protocol_evidence", "tests/integration/test_lifecycle.py::test_root_accept_cli_keeps_legacy_text_file_evidence", "--durations=10"],
  ["uv", "run", "pytest", "-q", "tests/integration/test_lifecycle.py::test_reclaim_preview_blocks"],
  ["uv", "run", "pytest", "-q", "tests/integration/test_lifecycle.py::test_ignored_content_keeps_linked_bootstrap_isolated", "tests/integration/test_lifecycle.py::test_pending_bootstrap_rejects_a_replaced_target_before_merging"],
  ["uv", "run", "pytest", "-q", "tests/integration/test_plugin_maintenance_script.py"],
  ["uv", "run", "pytest", "-q", "tests/integration/test_lifecycle.py::test_task_development_approval_uses_frozen_base_head"],
  ["uv", "run", "pytest", "-q", "tests/integration/test_candidate_batches.py::test_failed_combined_validation_preserves_base_and_generation_is_not_rerun"],
]

# 宽回归是明确里程碑入口（dww verify --level full --complete 或 CI），不会
# 因日常候选或尾批自动重复执行。压力层仍有独立显式入口。
[[profiles]]
id = "dww-core-complete"
paths = [
  ".github/**", ".solo-ai/**", "AGENTS.md", "pyproject.toml",
  "scripts/verify_repository.py", "tests/**", "uv.lock",
  "plugins/develop-with-worktrees/hooks/**",
  "plugins/develop-with-worktrees/skills/develop-with-worktrees/agents/**",
  "plugins/develop-with-worktrees/skills/develop-with-worktrees/scripts/**",
]
cross_task_reuse = false
external_state = "unknown"
input_paths = [
  ".github/**", ".solo-ai/**", "AGENTS.md", "pyproject.toml",
  "scripts/verify_repository.py", "tests/**", "uv.lock",
  "plugins/develop-with-worktrees/hooks/**",
  "plugins/develop-with-worktrees/skills/develop-with-worktrees/agents/**",
  "plugins/develop-with-worktrees/skills/develop-with-worktrees/scripts/**",
]
environment = ["PROCESSOR_ARCHITECTURE", "PROCESSOR_ARCHITEW6432"]
input_closure = "declared"
timeout_seconds = 43200
resource_class = "heavy"
level = "full"
full_scope = "complete"
commands = [
  ["uv", "run", "pytest", "-m", "dww_full and not dww_stress", "-vv", "-x", "--durations=30"],
]

schema_version = 3
static_only = false

[[profiles]]
id = "quick-ready"
paths = ["**"]
cross_task_reuse = true
external_state = "none"
input_paths = ["**"]
environment = []
input_closure = "complete"
timeout_seconds = 1200
resource_class = "normal"
level = "ready"
commands = [
  ["uvx", "ruff", "check", "."],
  ["uvx", "ruff", "format", "--check", "."],
  ["uv", "run", "pytest", "tests/unit", "-q"],
]

[[profiles]]
id = "full-suite"
paths = ["**"]
cross_task_reuse = false
external_state = "unknown"
input_paths = ["**"]
environment = []
input_closure = "declared"
timeout_seconds = 43200
resource_class = "heavy"
level = "full"
commands = [
  ["uv", "run", "pytest", "-vv", "-x"],
]

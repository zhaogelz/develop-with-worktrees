schema_version = 2
mode = "managed"
slots = 5
branch_prefix = "codex/"
worktree_directory = ".worktrees" # repository-relative only
port_base = 20000
remote_policy = "local-only"
sensitive_allowlist = []
agents_file_created = true

# Optional repository-declared scanner, for example: ["gitleaks", "protect", "--staged"]
# secret_scanner = []
# Optional serial preparation commands for an idle slot. No environment is copied.
# warm = [["uv", "sync"]]

# 每满 3 个候选自动封批。候选只保存源码；组合后的批次才按影响运行项目检查。
# 少于 3 个的尾批只在本轮明确结束或要求立即合入时，用 batch reconcile --force 封存。
integration = { mode = "batched", worktree_mode = "reusable", batch_size = 3, candidate_capacity = 10, seal_policy = "auto_full", candidate_validation = "batch", tail_policy = "explicit", tail_quiet_seconds = 30 }

[lifecycle]
# dev_start = ["npm", "run", "dev", "--", "--port", "{port}"]
# [lifecycle.readiness]
# kind = "http" # tcp or http
# target = "http://127.0.0.1:{port}/health"
# timeout_seconds = 30

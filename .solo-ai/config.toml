schema_version = 2
mode = "managed"
slots = 3
branch_prefix = "codex/"
worktree_directory = ".worktrees" # repository-relative only
port_base = 20000
remote_policy = "local-only"
sensitive_allowlist = []
agents_file_created = true

# Optional repository-declared scanner, for example: ["gitleaks", "protect", "--staged"]
# secret_scanner = []
# Optional serial preparation commands for an idle slot. No environment is copied.
# warm = [["uv", "sync"]]

# 每满 2 个候选自动封批；尾批只在通道稳定归零或明确要求时封存，无最长等待。
integration = { mode = "batched", worktree_mode = "reusable", batch_size = 2, candidate_capacity = 10, seal_policy = "auto_full", tail_policy = "quiet_or_explicit", tail_quiet_seconds = 30 }

[lifecycle]
# dev_start = ["npm", "run", "dev", "--", "--port", "{port}"]
# [lifecycle.readiness]
# kind = "http" # tcp or http
# target = "http://127.0.0.1:{port}/health"
# timeout_seconds = 30

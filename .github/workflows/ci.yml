name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v9.0.0
      - run: uv sync --dev
      - run: uv run pytest -vv -o faulthandler_timeout=30
      - run: uv run python -m compileall -q plugins/develop-with-worktrees/skills/develop-with-worktrees/scripts plugins/develop-with-worktrees/hooks
      - run: uvx ruff check .
      - run: uvx ruff format --check .

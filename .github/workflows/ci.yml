name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  DWW_SKIP_CODEX_CLI_INTEGRATION: "1"

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --dev
      - run: uv run pytest -vv -o faulthandler_timeout=30
      - run: uv run python -m compileall -q plugins/develop-with-worktrees/skills/develop-with-worktrees/scripts
      - run: uvx ruff check .
      - run: uvx ruff format --check .
